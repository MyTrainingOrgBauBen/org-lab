name: Org-Check

on:
    workflow_dispatch:

permissions: {}

jobs:
    check:
        runs-on: ubuntu-latest
        env:
            CHECK_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/hello.txt
        steps:
            - name: Check raw content
              uses: bauben/http-check-action@a302b9cf0273dcc16329ec2d51435a9467bf6642 #1.0.7
              with:
                url: ${{ env.CHECK_URL }}
                expected: "Hallo, Org!"
                retries: 3
            - name: Write to summary
              shell: bash
              env:
                GREETING: ${{ secrets.GREETING }}
                LAB_SECRET: ${{ secrets.LAB_SECRET  }}
              run: |
                if [ -z "$LAB_SECRET" ]; then
                    ISSET="nein"
                else
                    ISSET="ja"
                fi
                {
                    echo "The value of GREETING: $GREETING"
                    echo "Is LAB_SECRET set? $ISSET"
                    echo "The value of LAB_SECRET: $LAB_SECRET"
                } >> "$GITHUB_STEP_SUMMARY"
                